# The FreeRDP that OpenThinRDP ships (FREERDP_FROM=openthinrdp): FreeRDP with the UDP transport (RDPEUDP),
# built from this exact commit and packaged like Debian's trixie-backports freerdp3.
#
# Branch openthinrdp-udp-3.32.2-pr58 of the fork = FreeRDP 3.32.2 (security release of 2026-10-12, which already
# contains our USB fixes #13674 and #13679, and #13618)
#   + pull request #13608 (UDP transport, by Espen Tveit, approved by a FreeRDP maintainer) at its head f54ad1d36:
#     its 58 commits, applied unchanged but for two build-option lines of master. Several came from our tests:
#     ten SYN attempts, no false "stream is stuck" on lossy lines, run-length ACK vectors, reconnecting through the
#     broker after a one-time token, UDP declined only when the connection really goes through an RD Gateway
#   + from FreeRDP master, after 3.32.2:
#     - the header of bandwidth measure payloads is counted: with /network:auto Windows started every session 5 s
#       late (7cfe6fa12)
#     - /network is applied before the other options, so /network:auto no longer turns on the H.264 codecs that
#       RDP_GFX turned off (ours, #13748)
#     - the microphone keeps capturing when the server changes only the bit rate (ours, #13751)
#     - RD Gateway: a possible out-of-bounds read, RDG packet handling, a partly read header (five commits)
#     - USB: a failed kernel driver detach no longer stops the redirection (two commits)
#   + the webcam (ours, branch otr-camera-options): options h264, hwaccel and maxres of the camera channel, and
#     the defaults of OpenThinRDP (the H.264 of the camera off, the encoding on the video engine on)
# Every change is a commit with its own description: git log 3.32.2..openthinrdp-udp-3.32.2-pr58
# When the UDP transport lands in a FreeRDP release, OpenThinRDP goes back to Debian's packages.
FREERDP_REPO=https://github.com/Ceschi-ops/FreeRDP.git
FREERDP_COMMIT=fb0198dbea7b2f77b42e17f1b067df78e1d41401
# Debian version of the packages: <base>.<commit date and time>.<short commit>+otr<n>. The base stays above every
# Debian 3.32.x and above our earlier builds, so devices always take a newer build and a backports package never
# replaces it by accident.
FREERDP_VERSION_BASE=3.33.0~udp
FREERDP_OTR_REVISION=1
# Prebuilt packages of this commit: one archive attached to a release of the OpenThinRDP repository. build.sh
# downloads it and checks it against SHA256SUMS next to this file; without that file it builds them (build-debs.sh).
FREERDP_RELEASE_URL=https://github.com/OpenThinRdp/openthinrdp/releases/download/freerdp-fb0198dbe
