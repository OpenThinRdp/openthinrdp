menuentry 'Install OpenThinRDP (shows the disk and asks before erasing it)' --hotkey=i {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
menuentry 'Install alongside Windows (free space only, erases nothing)' --hotkey=w {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ otr.dualboot=1 --- quiet
	initrd	@INITRD_DI@
}
menuentry 'Unattended install (ERASES the first internal disk, no questions)' --hotkey=u {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ partman/confirm=true partman/confirm_nooverwrite=true partman/confirm_write_new_label=true partman-auto/purge_lvm_from_device=true partman-lvm/device_remove_lvm=true partman-md/device_remove_md=true partman-lvm/confirm=true partman-lvm/confirm_nooverwrite=true partman-md/confirm=true --- quiet
	initrd	@INITRD_DI@
}
