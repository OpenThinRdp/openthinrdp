# OpenThinRDP image build options. Copy the whole site.example folder to image/site and edit it.

# Installer and system language, time zone, keyboard (X11 layout: us, it, de, fr, ...)
LOCALE=en_US.UTF-8
TIMEZONE=Etc/UTC
KEYBOARD=us
# Password of the "otradmin" account, as a hash: mkpasswd -m yescrypt. It is asked by "su otradmin" in the
# Terminal of the settings dialog (there are no text consoles). Empty = no password (otradmin can log in only
# over SSH with a key, see SSH in site.conf). In single quotes: the hash contains "$" (ADMIN_PASSWORD_HASH='$y$j9T$...').
ADMIN_PASSWORD_HASH=
# FreeRDP: openthinrdp = FreeRDP with the UDP transport and USB fixes (default, see docs/udp.md)
#          backports = Debian trixie-backports (TCP only)
#          debian    = Debian trixie (TCP only)
#          site      = only the .deb files in debs/ (your own build)
FREERDP_FROM=openthinrdp
# The installer wipes the first INTERNAL disk (never a USB one) without asking anything: yes. no = the usual Debian questions.
AUTO_INSTALL=yes
# Chromium: kiosk page and web button (WEB_BUTTON=kiosk/app/browser). yes (default) or no: without it about
# 380 MB less, and only the remote desktop is available.
INCLUDE_BROWSER=yes
# Firmware: all = every firmware package, the image runs on any PC (default, and the downloadable ISO);
#           thinclient = only Intel/AMD graphics, Intel audio, Realtek network, Intel Wi-Fi (about 600 MB less)
FIRMWARE=all
# With FIRMWARE=thinclient, more firmware packages, space separated, e.g. firmware-atheros firmware-mediatek
EXTRA_FIRMWARE=
