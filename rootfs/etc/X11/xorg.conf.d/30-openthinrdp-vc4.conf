# OpenThinRDP: on a Raspberry Pi 4 or 5 the display controller (vc4) and the 3D engine (v3d) are two DRM devices.
# X takes the display one as its screen (the same rule as Raspberry Pi OS): otherwise it can pick v3d, which has no
# outputs, and start without a screen. No effect on a PC (no vc4 driver there).
Section "OutputClass"
    Identifier "OpenThinRDP vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
