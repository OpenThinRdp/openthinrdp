# OpenThinRDP - default settings.
#
# Settings are read in this order, the first file that defines a key wins:
#   1. /etc/openthinrdp/openthinrdp.conf   this device (settings dialog, central configuration)
#   2. /etc/openthinrdp/site.conf          your organization, built into the image (image/site.conf)
#   3. /opt/openthinrdp/defaults.conf      this file: project defaults, do not edit
#
# Format: KEY=value, one per line, no quotes. Empty value = not set.
# docs/configuration.md describes every key.

# --- Remote desktop -----------------------------------------------------------------------------
# RD Connection Broker (or a single session host). Name or IP.
BROKER=
# Fallback brokers, space separated: tried in turn when BROKER does not answer after 2 attempts.
BROKER_FALLBACK=
# Windows domain of the users.
DOMAIN=
# RDS collection, as in the .rdp file (loadbalanceinfo). Example: tsv://VMResource.1.MY_COLLECTION
LOAD_BALANCE_INFO=
# User name pre-filled in the login form.
DEFAULT_USER=
# Transport: auto = UDP, and TCP when UDP is blocked or fails (the session goes on)
#            udp  = UDP only: a connection that cannot use UDP is closed and retried, never kept on TCP
#            tcp  = TCP only
# UDP needs the FreeRDP of the OpenThinRDP image (WITH_RDPEUDP=ON); with another FreeRDP every mode is TCP.
TRANSPORT=auto
# Authentication packages: negotiate (Kerberos then NTLM) or ntlm (NTLM only; needed when Kerberos breaks
# on the broker redirect, "Ticket/authenticator don't match").
RDP_AUTH=negotiate
# Server certificate: ignore (accept any), tofu (trust on first use) or verify (must be trusted).
RDP_CERT=tofu
# RD Gateway (Remote Desktop Gateway), name[:port], e.g. rdgateway.example.com: the connection to the broker goes
# through it over HTTPS (443), with the credentials of the session. Empty = straight to the broker. Through a gateway
# the session uses TCP: FreeRDP carries no UDP over a gateway (its UDP transport, port 3391, is not implemented).
RDP_GATEWAY=
# always = every connection through the gateway; detect = a server on the local network straight, the others
# through the gateway (a device that moves between the office and outside). With a gateway set the session uses TCP
# also when it is not needed: FreeRDP declines UDP as soon as a gateway is configured.
RDP_GATEWAY_USE=always
# Graphics pipeline options for /gfx. Without a server GPU, progressive without H.264 keeps text pixel exact.
RDP_GFX=progressive,AVC420:off,AVC444:off
# Keyboard layout sent to Windows (/kbd:layout). Empty = derived from KEYBOARD.
RDP_KEYBOARD=
# Monitors: auto = the session uses every monitor when more than one is connected (/multimon); off = only the
# main monitor.
MULTIMON=auto
# Extra xfreerdp3 options, appended as they are (advanced).
RDP_EXTRA=
# A session that ends within this many seconds counts as a failed attempt and is retried (5-120).
SESSION_THRESHOLD=10
# Seconds before switching off after the user disconnects (0 = never switch off).
SHUTDOWN_SECS=10

# --- USB ----------------------------------------------------------------------------------------
# all   = every USB device except keyboards, mice, touch screens, hubs, network adapters, smart card readers,
#         Bluetooth, webcams and USB headsets goes to Windows as a whole device (USB sticks, signature keys,
#         tachograph keys...); a stick gets its drive letter inside the user's Windows session
# disks = USB sticks stay on the device and appear in Windows as drives (also when plugged in during a
#         session); smart card readers through /smartcard. USB_REDIRECT devices go whole in every mode
# auto  = device by device: one that is only storage (stick, card reader, disk) as a drive, one with storage
#         and something else (an instrument with a serial port, a key with its own driver) whole. Plugged in
#         during a session, auto works as disks
USB_MODE=all
# Extra devices (VID:PID, space separated) always passed whole, also in "disks" mode.
USB_REDIRECT=

# --- Network ------------------------------------------------------------------------------------
# dhcp or static. IPADDR/NETMASK/GATEWAY are used only with static.
NETMODE=dhcp
IPADDR=
NETMASK=255.255.255.0
GATEWAY=
# DNS servers. Empty = the ones from DHCP.
DNS1=
DNS2=
# Time servers, space separated. Empty = the Debian pool.
NTP=
# VPN for a device outside the office (vpn.sh): off, wireguard or openvpn. The broker, the management folder and the
# DNS of the office through the tunnel; inside WireGuard RDP keeps its UDP transport.
VPN=off
# WireGuard: the server, name[:port] (51820 when no port), and its public key; the address of THIS device in the
# tunnel (CIDR, e.g. 10.8.0.15/24: set it per device). The private key is made on the device and never leaves it:
# its public key is in the report (manager, Summary), to add this device as a peer of the server.
VPN_SERVER=
VPN_SERVER_KEY=
VPN_ADDRESS=
# Networks of the office through the tunnel (CIDR, space separated), e.g. 192.168.0.0/23. Empty = all the traffic.
# With OpenVPN they are added to the routes the server pushes.
VPN_ROUTES=
# DNS servers of the office, in front while the tunnel is up (with DOMAIN as search domain). Empty = WireGuard keeps
# the DNS it has; OpenVPN takes the ones the server pushes.
VPN_DNS=
# Wi-Fi: on/off. Used only when no cable is connected. The key is stored in /etc/wpa_supplicant only.
WIFI=off
WIFI_SSID=
WIFI_COUNTRY=
# Security of the Wi-Fi network: psk = a password (WPA2-Personal, WIFI_PSK); peap or tls = WPA2/WPA3-Enterprise with the
# 802.1X settings below (the same account or certificate as the cable)
WIFI_SECURITY=psk
# 802.1X on the cable (dot1x.sh): off; peap = an account and its password (PEAP-MSCHAPv2, e.g. Windows NPS with domain
# accounts); tls = a certificate of the device (EAP-TLS, e.g. from AD CS). The address is asked once the switch has
# opened the port. A port that does not answer 802.1X at all: after 15 s the network without it ("no authenticator").
DOT1X=off
# The identity: DOMAIN\user, user@domain, host/name.domain. With tls, empty = the common name of the certificate.
EAP_IDENTITY=
# Outer identity, sent before the encrypted tunnel (e.g. anonymous@example.com). Empty = the identity.
EAP_ANONYMOUS=
# The authority that signed the certificate of the RADIUS server: system (the system trust store, with the authorities
# of the site in /etc/openthinrdp/ca) or the name of one .crt file in /etc/openthinrdp/ca.
EAP_CA=system
# Name(s) the certificate of the server must be for (or a name under them), space separated, e.g. nps.example.com.
# Empty = any server with a certificate signed by EAP_CA: always set it.
# The password (EAP_PASSWORD: settings dialog, central settings or the manager) and the client certificate with its key
# (the manager, over SSH) are never in the settings: secrets of the device, in the TPM when there is one.
EAP_SERVER_NAME=

# --- Management ---------------------------------------------------------------------------------
# Management folder (SMB): status reports, central configuration (config\common.conf and
# config\<hostname>.conf) and signed updates (updates\). Example: \\fileserver\thinclients
# Empty = no central management. Credentials: /etc/openthinrdp/smb.cred (see docs/management.md).
MGMT_SHARE=
# Account of the management folder: DOMAIN\user, user@domain or user (then DOMAIN is its domain). Its password
# (MGMT_PASSWORD, settings dialog or central settings) goes only into /etc/openthinrdp/smb.cred, never in the
# settings. Empty = smb.cred as built into the image.
MGMT_USER=
# Debian security updates: on/off (FreeRDP is never updated automatically).
SECURITY_UPDATES=on
# The folder password, the Wi-Fi key, the SSH host keys, the VPN and 802.1X secrets kept encrypted in the TPM 2.0, when
# there is one: on/off.
# off on a device that had them in the TPM puts them back in root-only files at the next start.
TPM_SECRETS=on
# OpenThinRDP software updates (kiosk, FreeRDP with UDP, fixes), signed, never interrupting a session:
#   github = the releases of UPDATE_GITHUB, signed with the project key, checked every 3 hours
#   share  = the updates\ folder of MGMT_SHARE (a release copied there by the manager, or your own packages
#            signed with the key in /etc/openthinrdp/update-key.asc): you decide when the devices get it
#   off    = none
UPDATE_FROM=github
# GitHub repository of the releases (owner/repository): change it only for your own fork.
UPDATE_GITHUB=OpenThinRdp/openthinrdp
# Which signature an update from the management folder (UPDATE_FROM=share) needs:
#   any  = the project key or the key of the site (/etc/openthinrdp/update-key.asc)
#   site = the key of the site only: the manager re-signs the GitHub releases with it (the key is in its vault), so
#          a stolen project key installs nothing here. A device that has no site key yet still accepts the project
#          key (it gets the site key from a package signed by the project key, and is never left without updates).
UPDATE_KEY=any
# Which version: latest = the newest published; a version (e.g. 0.2.0) = exactly that one, also when it is older
# than the installed one (going back, FreeRDP included), and nothing newer until this changes. A pilot group:
# the current version in common.conf, latest in the config\<hostname>.conf of the pilot devices; latest for all
# when they are fine. From GitHub: the release v<version>; from the management folder: updates\versions\<version>.txt.
# Going back is possible to 0.2.0 or later (older versions do not know this setting).
UPDATE_TO=latest
# SSH for remote administration: on/off. Login only with the keys in /etc/openthinrdp/authorized_keys.
SSH=off
# Remote screen from the manager over SSH (needs SSH=on and a key): on/off. While it is on, the screen says so.
REMOTE_SCREEN=on

# --- Web button and kiosk page ------------------------------------------------------------------
# What the web button of the login form does:
#   none    = no button
#   app     = WEB_URL as an app window, only the sites in WEB_ALLOW can be opened
#   browser = Chromium with free browsing, WEB_URL as home page
#   kiosk   = at power on, KIOSK_URL full screen (5 s to stop it from the login form)
WEB_BUTTON=none
WEB_LABEL=Web
WEB_URL=
# Sites allowed in "app" mode, space separated (URL prefixes). WEB_URL is always allowed.
WEB_ALLOW=
KIOSK_URL=
# Reload the kiosk page every N minutes when nobody is using it (0 = never).
KIOSK_RELOAD_MIN=10

# --- Power schedule -----------------------------------------------------------------------------
# hh:mm, empty = never. Power on uses the RTC alarm (on Dell: "Deep Sleep Control" disabled in BIOS).
POWER_ON_TIME=
POWER_OFF_TIME=
# Days for power on, 1 = Monday ... 7 = Sunday.
POWER_ON_DAYS=1234567

# --- Look and language --------------------------------------------------------------------------
# Interface language: en or it.
LANGUAGE=en
# Keyboard layout (X11/console), e.g. us, it, de, fr.
KEYBOARD=us
# Window titles and login form heading.
TITLE=Remote desktop
# Logo in the dialogs (PNG, about 200 px wide). The splash screen uses /opt/openthinrdp/branding/splash.png.
# A logo or background picture in config\branding\ of the management folder wins over both (the Windows
# manager); the boot splash always keeps the image's own.
LOGO=/opt/openthinrdp/branding/logo.png
# Background: two colors for the gradient behind the splash logo.
BG_TOP=#1b2733
BG_BOTTOM=#000000
# Extra line in error messages, e.g. "Call the IT desk, ext. 123". Empty = a generic sentence.
SUPPORT_TEXT=
# PIN that protects the settings dialog (stored as sha256, see docs/configuration.md). Empty = no PIN.
SETTINGS_PIN_SHA256=
